name: Vérifier la connexion Instagram
on:
  push:
    paths: ['checks/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check.mjs
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - run: |
          git config user.name "bible-academy-bot"; git config user.email "bot@bibleacademyapp.com"
          git add state/check.json && git commit -m "Vérification Instagram" && git pull --rebase -q && git push -q
